[project]
name = "scrap2sync-api"
version = "0.1.0"
description = "Source-preserving standup draft API"
requires-python = "==3.14.7"
dependencies = ["fastapi==0.141.1", "pydantic==2.13.5", "httpx==0.28.1", "uvicorn==0.52.4"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-cov==7.1.0", "hypothesis==6.167.1", "mypy==2.3.1", "ruff==0.16.6", "pip-audit==2.10.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
