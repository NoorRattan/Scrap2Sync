name: Release verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  FORMATTER_PROVIDER: disabled
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Locked backend install
        working-directory: services/api
        run: uv sync --frozen
      - name: Backend checks and generated contract
        working-directory: services/api
        run: |
          uv run --frozen ruff format --check app tests
          uv run --frozen ruff check app tests
          uv run --frozen mypy app
          uv run --frozen python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
          uv run --frozen python -m app.export_openapi --check
          uv run --frozen pip-audit
      - name: Locked frontend install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Frontend checks
        working-directory: apps/web
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run contract:check
          npm run test:coverage
          npm audit --audit-level=high
          npm run build
          npx --no-install playwright install --with-deps chromium
      - name: Start the disabled-provider API
        run: |
          cd services/api
          uv run --frozen uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log --no-proxy-headers &
      - name: Browser scenarios
        working-directory: apps/web
        run: npm run test:e2e
      - name: Frozen benchmark
        run: services/api/.venv/bin/python evaluation/evaluate.py --review evaluation/reports/primary-review.json --require-semantic-pass
      - name: Source, workflow and dependency scans
        run: |
          python scripts/security_scan.py
          python scripts/fetch_tools.py
          .tools/actionlint/actionlint
          .tools/gitleaks/gitleaks dir . --redact --config .gitleaks.toml
          .tools/trivy/trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .tools,.cache,apps/web/node_modules,apps/web/.next,services/api/.venv .
      - name: Generate SBOMs
        run: |
          mkdir -p docs/reports
          cd apps/web
          npm sbom --sbom-format cyclonedx --omit=dev > ../../docs/reports/web-sbom.json
          cd ../../services/api
          uv run --frozen pip-audit --format cyclonedx-json --output ../../docs/reports/api-sbom.json
      - name: Build and inspect non-root containers
        run: |
          docker build --tag scrap2sync-web:ci --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000 apps/web
          test "$(docker image inspect scrap2sync-web:ci --format '{{.Config.User}}')" = 'node'
          docker run --detach --name scrap2sync-web-ci --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 2 --publish 127.0.0.1:3001:3000 scrap2sync-web:ci
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/api/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs scrap2sync-web-ci
              exit 1
            fi
            sleep 1
          done
          .tools/trivy/trivy image --severity HIGH,CRITICAL --exit-code 1 scrap2sync-web:ci
          docker rm --force scrap2sync-web-ci
          docker build --tag scrap2sync-api:ci services/api
          test "$(docker image inspect scrap2sync-api:ci --format '{{.Config.User}}')" = '10001:10001'
          docker run --detach --name scrap2sync-ci --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 2 --publish 127.0.0.1:8001:8000 scrap2sync-api:ci
          python scripts/container_smoke.py
          .tools/trivy/trivy image --severity HIGH,CRITICAL --exit-code 1 scrap2sync-api:ci
          docker rm --force scrap2sync-ci
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification
          path: |
            services/api/coverage.xml
            apps/web/coverage/
            apps/web/playwright-report/
            evaluation/reports/
            docs/reports/
          retention-days: 7
